apiVersion: kubesmart.smtx.io/v1alpha1
kind: KubeSmartCluster
metadata:
  name: net-rk
  namespace: default
spec:
  cloudProvider:
    cloudtower:
      cloudtowerServer:
        secretRef:
          name: cloudtower-server
          namespace: default
      elfCluster: dd1f408f-7715-48c1-a817-13c3568f1d93
      elfClusterType: Standard
      vmTemplate: sks-rocky-9.6-amd64-ens4-k8s-v1.27.16-template-v7rc3-20250904025907
      zbsVip: ""
    name: cloudtower
  clusterConfiguration:
    audit:
      kubeAPIServer:
        usePolicy: normal
    autoResourceReserved: true
    customImageRegistry: 10.255.128.144/sks
    kubernetes:
      controlPlane:
        clusterConfiguration:
          apiServer:
            extraArgs:
              admission-control-config-file: /etc/kubernetes/admission.yaml
              audit-log-batch-buffer-size: "102400"
              audit-log-batch-max-size: "10"
              audit-log-batch-max-wait: 5s
              audit-log-maxage: "7"
              audit-log-maxbackup: "5"
              audit-log-maxsize: "100"
              audit-log-mode: batch
              audit-log-path: /var/log/apiserver/audit.log
              audit-log-truncate-enabled: "true"
              audit-policy-file: /etc/kubernetes/audit-policy-pl5uw62.yaml
              enable-admission-plugins: EventRateLimit
              profiling: "false"
              request-timeout: 300s
              tls-cipher-suites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384
              tls-min-version: VersionTLS12
            extraVolumes:
            - hostPath: /var/log/apiserver
              mountPath: /var/log/apiserver
              name: apiserver-log
              pathType: DirectoryOrCreate
            - hostPath: /etc/kubernetes/admission.yaml
              mountPath: /etc/kubernetes/admission.yaml
              name: admission-config
              pathType: FileOrCreate
              readOnly: true
            - hostPath: /etc/kubernetes/auditpolicy.yaml
              mountPath: /etc/kubernetes/audit-policy-pl5uw62.yaml
              name: audit-policy
              pathType: FileOrCreate
              readOnly: true
          controllerManager:
            extraArgs:
              profiling: "false"
              terminated-pod-gc-threshold: "10"
              tls-cipher-suites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384
