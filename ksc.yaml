              tls-min-version: VersionTLS12
        files:
        - content: |
            apiVersion: apiserver.config.k8s.io/v1
            kind: AdmissionConfiguration
            plugins:
              - name: EventRateLimit
                configuration:
                  apiVersion: eventratelimit.admission.k8s.io/v1alpha1
                  kind: Configuration
                  limits:
                    - type: Server
                      burst: 20000
                      qps: 5000
          owner: root:root
          path: /etc/kubernetes/admission.yaml
        - content: |
            apiVersion: audit.k8s.io/v1
            kind: Policy
            metadata:
              creationTimestamp: null
            omitManagedFields: true
            omitStages:
            - RequestReceived
            - ResponseStarted
            rules:
            - level: None
              userGroups:
              - system:nodes
              - system:serviceaccounts:kube-system
              - system:unauthenticated
            - level: None
              users:
              - system:kube-scheduler
              - system:volume-scheduler
              - system:kube-controller-manager
              - system:serviceaccount:sks-system:sks-packages-sa
              - system:serviceaccount:kapp-controller:kapp-controller-sa
              - system:serviceaccount:sks-system:tigera-operator
              - system:serviceaccount:sks-system-monitoring:prometheus-operator
            - level: None
              nonResourceURLs:
              - /api*
              - /version
              - /healthz*
              - /swagger*
              - /ready*
            - level: None
              resources:
              - group: coordination.k8s.io
                resources:
                - leases
              - group: authentication.k8s.io
                resources:
                - tokenreviews
              - group: authorization.k8s.io
            - level: Metadata
              verbs:
              - create
              - delete
              - deletecollection
              - patch
              - update
          owner: root:root
          path: /etc/kubernetes/auditpolicy.yaml
          permissions: "0644"
        initConfiguration:
          localAPIEndpoint: {}
          nodeRegistration:
            kubeletExtraArgs:
              event-qps: "0"
              protect-kernel-defaults: "true"
              serialize-image-pulls: "false"
              tls-cipher-suites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384
              tls-min-version: VersionTLS12
        joinConfiguration:
          discovery: {}
          nodeRegistration:
            kubeletExtraArgs:
              event-qps: "0"
              protect-kernel-defaults: "true"
              serialize-image-pulls: "false"
              tls-cipher-suites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384
              tls-min-version: VersionTLS12
      kubeletConfiguration:
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        shutdownGracePeriod: 45s
        shutdownGracePeriodCriticalPods: 30s
      workers:
        joinConfiguration:
          discovery: {}
          nodeRegistration:
            kubeletExtraArgs:
              event-qps: "0"
              protect-kernel-defaults: "true"
              serialize-image-pulls: "false"
              tls-cipher-suites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384
              tls-min-version: VersionTLS12
    ntp:
      servers:
      - 182.92.12.11
      - 14.29.218.92
      sync: true
    operation: {}
    proxy: {}
    security:
